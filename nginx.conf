map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ──────────────────────────────────────────────────────────────────────────────
# Rate Limiting — protección contra DoS y fuerza bruta.
#   - api_general: 10 req/s por IP para endpoints de lectura
#   - api_write:    5 req/s por IP para endpoints de escritura (POST/PUT/DELETE)
# La zona usa $binary_remote_addr (16 bytes por IP) en 10MB (~640k IPs).
# ──────────────────────────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_write:10m rate=5r/s;

# ──────────────────────────────────────────────────────────────────────────────
# CORS — orígenes permitidos para clientes que dependen del gateway:
#   - Web SPA / Next.js  (http://localhost, :3000, :5173)
#   - Flutter Web        (http://localhost:8080 y otros puertos dinámicos)
#   - Android emulator   (http://10.0.2.2 → mapea al host del emulador)
#   - 127.0.0.1          (alias de localhost para algunos toolings)
# Si el origin no matchea, $cors_origin queda vacío y el navegador rechaza.
# ──────────────────────────────────────────────────────────────────────────────
map $http_origin $cors_origin {
    default                                      "";
    "~^http://localhost(:[0-9]+)?$"              $http_origin;
    "~^http://127\.0\.0\.1(:[0-9]+)?$"           $http_origin;
    "~^http://10\.0\.2\.2(:[0-9]+)?$"            $http_origin;
}

server {
    listen 80 ssl;
    server_name _;

    # Certificados SSL generados localmente
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Protocolos y ciphers explícitos — sin estas directivas Nginx usaría sus
    # defaults (que en 1.27 ya son TLS 1.2/1.3) pero declararlos hace la
    # superficie de ataque auditable: no se aceptan TLS 1.0/1.1 ni RC4/3DES.
    # TLS 1.3 trae sus propias cipher suites (TLS_AES_256_GCM_SHA384, etc.) y
    # ssl_ciphers solo afecta a TLS 1.2; el orden lo elige el cliente.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/pets {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin       $cors_origin always;
            add_header Access-Control-Allow-Credentials  true         always;
            add_header Access-Control-Allow-Methods      "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers      "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Max-Age            3600         always;
            add_header Content-Length                    0;
            add_header Content-Type                      "text/plain; charset=utf-8";
            return 204;
        }
        add_header Access-Control-Allow-Origin       $cors_origin always;
        add_header Access-Control-Allow-Credentials  true         always;

        set $pets_upstream http://pets-service:8000;
        proxy_pass         $pets_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/chat/graphql {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin       $cors_origin always;
            add_header Access-Control-Allow-Credentials  true         always;
            add_header Access-Control-Allow-Methods      "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers      "Authorization, Content-Type, Accept, Origin, X-Requested-With, apollo-require-preflight" always;
            add_header Access-Control-Max-Age            3600         always;
            add_header Content-Length                    0;
            add_header Content-Type                      "text/plain; charset=utf-8";
            return 204;
        }
        add_header Access-Control-Allow-Origin       $cors_origin always;
        add_header Access-Control-Allow-Credentials  true         always;

        set $chat_upstream http://chat-service:8081;
        proxy_pass         $chat_upstream/graphql;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Fallback REST/HTTP del chat-service: cualquier ruta bajo /api/chat/ que no
    # sea exact-match de /api/chat/graphql ni prefix de /api/chat/ws cae aquí
    # (NGINX prioriza exact > prefix más largo > prefix más corto). El path se
    # reescribe stripping /api/chat para que el backend reciba /<resto>.
    location /api/chat/ {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin       $cors_origin always;
            add_header Access-Control-Allow-Credentials  true         always;
            add_header Access-Control-Allow-Methods      "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers      "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Max-Age            3600         always;
            add_header Content-Length                    0;
            add_header Content-Type                      "text/plain; charset=utf-8";
            return 204;
        }
        add_header Access-Control-Allow-Origin       $cors_origin always;
        add_header Access-Control-Allow-Credentials  true         always;

        set $chat_upstream http://chat-service:8081;
        rewrite ^/api/chat/(.*)$ /$1 break;
        proxy_pass         $chat_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ──────────────────────────────────────────────────────────────────────
    # Nuevos servicios P2 — el gateway resuelve CORS aquí porque estos
    # servicios todavía no implementan filtros propios.
    # ──────────────────────────────────────────────────────────────────────

    location /api/notifications {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin       $cors_origin always;
            add_header Access-Control-Allow-Credentials  true         always;
            add_header Access-Control-Allow-Methods      "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers      "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Max-Age            3600         always;
            add_header Content-Length                    0;
            add_header Content-Type                      "text/plain; charset=utf-8";
            return 204;
        }
        add_header Access-Control-Allow-Origin       $cors_origin always;
        add_header Access-Control-Allow-Credentials  true         always;

        set $notif_upstream http://notification-service:8082;
        proxy_pass         $notif_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/matches {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin       $cors_origin always;
            add_header Access-Control-Allow-Credentials  true         always;
            add_header Access-Control-Allow-Methods      "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers      "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Max-Age            3600         always;
            add_header Content-Length                    0;
            add_header Content-Type                      "text/plain; charset=utf-8";
            return 204;
        }
        add_header Access-Control-Allow-Origin       $cors_origin always;
        add_header Access-Control-Allow-Credentials  true         always;

        set $match_upstream http://matching-service:8083;
        proxy_pass         $match_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/search {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin       $cors_origin always;
            add_header Access-Control-Allow-Credentials  true         always;
            add_header Access-Control-Allow-Methods      "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers      "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Max-Age            3600         always;
            add_header Content-Length                    0;
            add_header Content-Type                      "text/plain; charset=utf-8";
            return 204;
        }
        add_header Access-Control-Allow-Origin       $cors_origin always;
        add_header Access-Control-Allow-Credentials  true         always;

        set $search_upstream http://matching-service:8083;
        proxy_pass         $search_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/media {
        limit_req zone=api_write burst=10 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin       $cors_origin always;
            add_header Access-Control-Allow-Credentials  true         always;
            add_header Access-Control-Allow-Methods      "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers      "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Max-Age            3600         always;
            add_header Content-Length                    0;
            add_header Content-Type                      "text/plain; charset=utf-8";
            return 204;
        }
        add_header Access-Control-Allow-Origin       $cors_origin always;
        add_header Access-Control-Allow-Credentials  true         always;

        set $media_upstream http://media-service:8084;
        proxy_pass         $media_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    location /api/chat/ws {
        set $chat_upstream http://chat-service:8081;
        proxy_pass         $chat_upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ──────────────────────────────────────────────────────────────────────
    # Frontend (Next.js SSR) — catch-all para todo lo que no sea /api/*
    # Cubre páginas SSR, /_next/static, /_next/image, /_next/data y assets.
    # ──────────────────────────────────────────────────────────────────────
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass         $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
