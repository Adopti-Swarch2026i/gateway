ssl_trusted_certificate /etc/nginx/certs/ca.crt;
proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_ssl_session_reuse on;
proxy_ssl_server_name on;

log_format adopti_tls escape=json
    '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status":$status,'
      '"bytes_sent":$bytes_sent,'
      '"ssl_protocol":"$ssl_protocol",'
      '"ssl_cipher":"$ssl_cipher",'
      '"ssl_session_reused":"$ssl_session_reused",'
      '"request_time":$request_time,'
      '"upstream_response_time":"$upstream_response_time",'
      '"user_agent":"$http_user_agent"'
    '}';

access_log /var/log/nginx/access.log adopti_tls;
error_log  /var/log/nginx/error.log warn;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ──────────────────────────────────────────────────────────────────────────────
# CORS — orígenes permitidos para clientes que dependen del gateway:
#   - Web SPA / Next.js  (https://localhost, :3000, :5173)
#   - Flutter Web        (https://localhost:8080 y otros puertos dinámicos)
#   - Android emulator   (https://10.0.2.2 → mapea al host del emulador)
#   - 127.0.0.1          (alias de localhost para algunos toolings)
# Si el origin no matchea, $cors_origin queda vacío y el navegador rechaza.
# ──────────────────────────────────────────────────────────────────────────────
map $http_origin $cors_origin {
    default                                      "";
    "~^https://localhost(:[0-9]+)?$"              $http_origin;
    "~^https://127\.0\.0\.1(:[0-9]+)?$"           $http_origin;
    "~^https://10\.0\.2\.2(:[0-9]+)?$"            $http_origin;
}

# ── BLOQUE 1: HTTP → HTTPS (redirección permanente) ───────────────────────────
server {
    listen 80 ssl;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── BLOQUE 2: HTTPS — toda la lógica de proxy ─────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    # Certificados
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Protocolos y cipher suites modernos (TLS 1.2 + 1.3 únicamente)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_ecdh_curve secp384r1;

    # Session resumption
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 200 "ok\n";
    }

    location = /nginx_status {
        stub_status;
        allow 172.18.0.0/16;
        deny all;
    }

    location /api/pets {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin       $cors_origin always;
            add_header Access-Control-Allow-Credentials  true         always;
            add_header Access-Control-Allow-Methods      "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers      "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Max-Age            3600         always;
            add_header Content-Length                    0;
            add_header Content-Type                      "text/plain; charset=utf-8";
            return 204;
        }
        add_header Access-Control-Allow-Origin       $cors_origin always;
        add_header Access-Control-Allow-Credentials  true         always;

        set $pets_upstream https://pets-service:8443;
        proxy_pass         $pets_upstream;
        proxy_ssl_name     pets-service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/chat/graphql {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin       $cors_origin always;
            add_header Access-Control-Allow-Credentials  true         always;
            add_header Access-Control-Allow-Methods      "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers      "Authorization, Content-Type, Accept, Origin, X-Requested-With, apollo-require-preflight" always;
            add_header Access-Control-Max-Age            3600         always;
            add_header Content-Length                    0;
            add_header Content-Type                      "text/plain; charset=utf-8";
            return 204;
        }
        add_header Access-Control-Allow-Origin       $cors_origin always;
        add_header Access-Control-Allow-Credentials  true         always;

        set $chat_upstream https://chat-service:8443;
        proxy_pass         $chat_upstream/graphql;
        proxy_ssl_name     chat-service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Fallback REST/HTTP del chat-service: cualquier ruta bajo /api/chat/ que no
    # sea exact-match de /api/chat/graphql ni prefix de /api/chat/ws cae aquí
    # (NGINX prioriza exact > prefix más largo > prefix más corto). El path se
    # reescribe stripping /api/chat para que el backend reciba /<resto>.
    location /api/chat/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin       $cors_origin always;
            add_header Access-Control-Allow-Credentials  true         always;
            add_header Access-Control-Allow-Methods      "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers      "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Max-Age            3600         always;
            add_header Content-Length                    0;
            add_header Content-Type                      "text/plain; charset=utf-8";
            return 204;
        }
        add_header Access-Control-Allow-Origin       $cors_origin always;
        add_header Access-Control-Allow-Credentials  true         always;

        set $chat_upstream https://chat-service:8443;
        rewrite ^/api/chat/(.*)$ /$1 break;
        proxy_pass         $chat_upstream;
        proxy_ssl_name     chat-service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ──────────────────────────────────────────────────────────────────────
    # Nuevos servicios P2 — el gateway resuelve CORS aquí porque estos
    # servicios todavía no implementan filtros propios.
    # ──────────────────────────────────────────────────────────────────────

    location /api/notifications {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin       $cors_origin always;
            add_header Access-Control-Allow-Credentials  true         always;
            add_header Access-Control-Allow-Methods      "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers      "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Max-Age            3600         always;
            add_header Content-Length                    0;
            add_header Content-Type                      "text/plain; charset=utf-8";
            return 204;
        }
        add_header Access-Control-Allow-Origin       $cors_origin always;
        add_header Access-Control-Allow-Credentials  true         always;

        set $notif_upstream https://notification-service:8443;
        proxy_pass         $notif_upstream;
        proxy_ssl_name     notification-service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/matches {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin       $cors_origin always;
            add_header Access-Control-Allow-Credentials  true         always;
            add_header Access-Control-Allow-Methods      "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers      "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Max-Age            3600         always;
            add_header Content-Length                    0;
            add_header Content-Type                      "text/plain; charset=utf-8";
            return 204;
        }
        add_header Access-Control-Allow-Origin       $cors_origin always;
        add_header Access-Control-Allow-Credentials  true         always;

        set $match_upstream https://matching-service:8443;
        proxy_pass         $match_upstream;
        proxy_ssl_name     matching-service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/search {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin       $cors_origin always;
            add_header Access-Control-Allow-Credentials  true         always;
            add_header Access-Control-Allow-Methods      "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers      "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Max-Age            3600         always;
            add_header Content-Length                    0;
            add_header Content-Type                      "text/plain; charset=utf-8";
            return 204;
        }
        add_header Access-Control-Allow-Origin       $cors_origin always;
        add_header Access-Control-Allow-Credentials  true         always;

        set $search_upstream https://matching-service:8443;
        proxy_pass         $search_upstream;
        proxy_ssl_name     matching-service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/media {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin       $cors_origin always;
            add_header Access-Control-Allow-Credentials  true         always;
            add_header Access-Control-Allow-Methods      "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers      "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Max-Age            3600         always;
            add_header Content-Length                    0;
            add_header Content-Type                      "text/plain; charset=utf-8";
            return 204;
        }
        add_header Access-Control-Allow-Origin       $cors_origin always;
        add_header Access-Control-Allow-Credentials  true         always;

        set $media_upstream https://media-service:8443;
        proxy_pass         $media_upstream;
        proxy_ssl_name     media-service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    location /api/chat/ws {
        set $chat_upstream https://chat-service:8443;
        proxy_pass         $chat_upstream/ws;
        proxy_ssl_name     chat-service;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ──────────────────────────────────────────────────────────────────────
    # Frontend (Next.js SSR) — catch-all para todo lo que no sea /api/*
    # Cubre páginas SSR, /_next/static, /_next/image, /_next/data y assets.
    # ──────────────────────────────────────────────────────────────────────
    location / {
        set $frontend_upstream https://frontend:3000;
        proxy_pass         $frontend_upstream;
        proxy_ssl_name     frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
